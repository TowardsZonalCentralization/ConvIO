name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: CONVIO-Windows
            archive_ext: zip
          - os: ubuntu-latest
            artifact_name: CONVIO-Linux
            archive_ext: tar.gz
          - os: macos-latest
            artifact_name: CONVIO-macOS
            archive_ext: tar.gz

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --windowed --onedir --name CONVIO main.py

    - name: Prepare Release Folder (Windows)
      if: runner.os == 'Windows'
      run: |
        copy config.yaml dist\CONVIO\
        mkdir dist\CONVIO\data
        mkdir dist\CONVIO\export
        mkdir dist\CONVIO\logs
        Copy-Item -Path data\* -Destination dist\CONVIO\data\ -Recurse
        Compress-Archive -Path dist\CONVIO\* -DestinationPath ${{ matrix.artifact_name }}.zip

    - name: Prepare Release Folder (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cp config.yaml dist/CONVIO/
        mkdir -p dist/CONVIO/data
        mkdir -p dist/CONVIO/export
        mkdir -p dist/CONVIO/logs
        cp -r data dist/CONVIO/
        cd dist/CONVIO && tar -czvf ../../${{ matrix.artifact_name }}.tar.gz * && cd ../..

    # NEW STEP: Upload directly to the GitHub Release associated with the tag
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}